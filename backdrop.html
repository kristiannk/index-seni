<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stage Display — INDEX 1.0</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }

@keyframes fadeIn {
  from { opacity: 0; transform: scale(.95); }
  to { opacity: 1; transform: scale(1); }
}
@keyframes fadeOut {
  from { opacity: 1; transform: scale(1); }
  to { opacity: 0; transform: scale(.95); }
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: .4; }
}
@keyframes nameGlow {
  0%, 100% { filter: drop-shadow(0 0 30px rgba(125,42,232,.2)) drop-shadow(0 0 60px rgba(255,215,0,.1)); }
  50% { filter: drop-shadow(0 0 50px rgba(125,42,232,.4)) drop-shadow(0 0 100px rgba(255,215,0,.2)); }
}

body {
  font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
  background: radial-gradient(ellipse at center, #1a0030 0%, #0d0018 50%, #050010 100%);
  color: #fff;
  height: 100vh;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

/* Canvas for particles */
#particleCanvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
}

/* Subtle grid lines */
.grid-lines {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image:
    linear-gradient(rgba(255,255,255,.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.015) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
  z-index: 0;
}

/* Top bar gradient */
.topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: linear-gradient(90deg, #7d2ae8, #ffd700, #ff6b9d, #7d2ae8);
  background-size: 300% 100%;
  animation: scanline 3s linear infinite;
  z-index: 10;
}

/* Brand top left */
.brand {
  position: fixed;
  top: 24px;
  left: 32px;
  z-index: 10;
  text-align: left;
}
.brand-main {
  font-size: 28px;
  font-weight: 900;
  letter-spacing: 1px;
  background: linear-gradient(135deg, #7d2ae8, #ffd700);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1;
}
.brand-sub {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 3px;
  color: rgba(255,255,255,.3);
  text-transform: uppercase;
  margin-top: 2px;
}

/* Top right — institution logos */
.top-right {
  position: fixed;
  top: 20px;
  right: 32px;
  display: flex;
  align-items: center;
  gap: 20px;
  z-index: 10;
}
.top-right .logo-placeholder {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.08);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.top-right .logo-placeholder img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* Main container */
.container {
  text-align: center;
  padding: 40px;
  max-width: 92vw;
  position: relative;
  z-index: 1;
}

/* Central glow behind content */
.center-glow {
  position: absolute;
  top: 50%; left: 50%;
  width: 70vmin; height: 70vmin;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle, rgba(125,42,232,.1) 0%, rgba(255,215,0,.03) 30%, transparent 60%);
  border-radius: 50%;
  pointer-events: none;
  z-index: -1;
  animation: nameGlow 4s ease-in-out infinite;
}

/* Live indicator */
.live-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 18px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,.08);
  background: rgba(255,255,255,.03);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: rgba(255,255,255,.3);
  margin-bottom: 36px;
}
.live-badge .dot {
  width: 6px; height: 6px;
  background: #ff4444;
  border-radius: 50%;
  animation: pulse 1.5s infinite;
}

.stage-label {
  font-size: clamp(13px, 1.3vw, 20px);
  font-weight: 600;
  letter-spacing: 6px;
  text-transform: uppercase;
  color: rgba(255,255,255,.2);
  margin-bottom: 10px;
}

.category {
  display: inline-block;
  padding: 6px 22px;
  border-radius: 4px;
  background: linear-gradient(135deg, rgba(125,42,232,.4), rgba(255,215,0,.15));
  border: 1px solid rgba(255,215,0,.1);
  font-size: clamp(11px, 1vw, 15px);
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: rgba(255,255,255,.7);
  margin-bottom: 30px;
}

/* Participant name */
.name-wrapper {
  position: relative;
  display: inline-block;
  padding: 0 20px;
}
.name {
  font-size: clamp(32px, 5vw, 72px);
  font-weight: 900;
  background: linear-gradient(135deg, #9d4eff, #ffd700, #ff6b9d, #9d4eff);
  background-size: 300% 100%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1.1;
  letter-spacing: -1px;
  animation: nameGlow 3s ease-in-out infinite;
}

/* Event name */
.event-name {
  font-size: clamp(12px, 1.2vw, 18px);
  font-weight: 700;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: rgba(255,255,255,.4);
  margin-top: 12px;
}
.tagline {
  font-size: clamp(10px, .9vw, 14px);
  font-weight: 400;
  letter-spacing: 3px;
  color: rgba(255,255,255,.2);
  margin-top: 4px;
}
.number {
  font-size: clamp(14px, 1.5vw, 22px);
  color: rgba(255,255,255,.3);
  font-weight: 400;
  letter-spacing: 2px;
  margin-top: 20px;
}
.divider {
  width: 80px;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(255,215,0,.4), transparent);
  margin: 20px auto 0;
  border-radius: 1px;
}

/* Status bar */
.status-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 32px;
  background: rgba(0,0,0,.5);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  font-size: 10px;
  color: rgba(255,255,255,.15);
  letter-spacing: 1px;
  z-index: 10;
  border-top: 1px solid rgba(255,255,255,.03);
}
.status-bar .connected { color: rgba(0,196,204,.7); }
.status-bar .disconnected { color: rgba(255,255,255,.15); }

/* Idle */
.idle {
  font-size: clamp(18px, 2vw, 28px);
  color: rgba(255,255,255,.1);
  font-weight: 400;
  letter-spacing: 2px;
}
.idle-icon {
  font-size: clamp(40px, 5vw, 64px);
  margin-bottom: 16px;
  opacity: .06;
}

/* Transition overlay */
.transition-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: radial-gradient(ellipse at center, rgba(125,42,232,.15), transparent);
  pointer-events: none;
  z-index: 0;
  opacity: 0;
  transition: opacity .3s;
}
.transition-overlay.active {
  opacity: 1;
}
</style>
</head>
<body>
<div class="topbar"></div>
<div class="grid-lines"></div>
<div class="transition-overlay" id="transitionOverlay"></div>

<canvas id="particleCanvas"></canvas>

<div class="brand">
  <div class="brand-main">INDEX 1.0</div>
  <div class="brand-sub">Informatics Dies Natalis Expo</div>
</div>

<div class="top-right">
  <div class="logo-placeholder"><img src="hmti.jpg" alt="HMTI"></div>
  <div class="logo-placeholder"><img src="umrah.png" alt="UMRAH"></div>
</div>

<div class="container" id="mainContainer">
  <div class="center-glow"></div>
  <div class="live-badge"><span class="dot"></span>LIVE</div>
  <div class="stage-label">Now Performing</div>
  <div class="category" id="categoryDisplay">—</div>
  <div id="displayArea">
    <div class="idle-icon">🎭</div>
    <div class="idle">Menunggu operator...</div>
  </div>
</div>

<div class="status-bar">
  <span id="connectionStatus" class="disconnected">⏳ Menunggu koneksi...</span>
  <span>INFORMATICS DIES NATALIS EXPO</span>
</div>

<audio id="backdropAudio" style="display:none" crossorigin="anonymous"></audio>

<script src="/socket.io/socket.io.js"></script>
<script>
const displayArea = document.getElementById('displayArea');
const categoryDisplay = document.getElementById('categoryDisplay');
const connectionStatus = document.getElementById('connectionStatus');
const backdropAudio = document.getElementById('backdropAudio');
const mainContainer = document.getElementById('mainContainer');
const transitionOverlay = document.getElementById('transitionOverlay');
let lastState = null;
let currentAudioFile = null;

// ===========================================
const FILE_MAP = {
  'vokal::Febriyani': 'src/VOKAL SOLO/FEBRIYANI.mp4',
  'vokal::M. Fathur Sadiq': 'src/VOKAL SOLO/M. Fathur Sadiq ( sepenuh hati ).mp3',
  'vokal::Deni Kristiani Saragih': 'src/VOKAL SOLO/Deni Kristiani Saragih - Mengejar Matahari_.mp4',
  'vokal::Asti Puji Lestari': 'src/VOKAL SOLO/ASTI PUJI LESTARI_TAK KAN TERGANTI-SHABRINA LEANOR, YOVIE WIDIANTO.mp4',
  'vokal::Muhammad Fauzi': 'src/VOKAL SOLO/Muhammad Fauzi_Sign of The Times.mp3',
  'vokal::Solihin Ramadhan': 'src/VOKAL SOLO/Solihin_SORGA DIBAWAH TELAPAK KAKI IBU KARAOKE.mp3',
  'vokal::Araghina Martha Undari': 'src/VOKAL SOLO/ARAGHINA MARTHA UNDARI_PERAHU KERTAS.mp4',
  'vokal::Felicia Isabella Ygo': 'src/VOKAL SOLO/Felicia Isabella Ygo .mp3',
  'vokal::Sindi Agustin': 'src/VOKAL SOLO/Sindi Agustin_Terlalu cinta_.mp4',
  'vokal::Yowanda Aviva Syahira': 'src/VOKAL SOLO/Yowanda Aviva Syahira.NIRMALA.mp4',
  'vokal::Ririn Dwi Sabrina Sembiring Kembaren': 'src/VOKAL SOLO/Ririn Sembiring_Boru Panggoaran.mp3',
  'vokal::Berliana Dwi Az-zahara': 'src/VOKAL SOLO/Berliana Dwi Az-zahara_Jikalau kau cinta.mp4',
  'vokal::Stefani Oktavia Simbolon': 'src/VOKAL SOLO/Stefani Oktavia Simbolon_Cinta Sejati (BCL).mp3',
  'tari::Muhammad Faisyar Rizqi': 'src/TARI MODERN/Muhammad Faisyar Rizqi_Intro Fake Love + Chains.mp3',
  'tari::TRIARCHY': 'src/TARI MODERN/TRIARCHY[FROM ZERO TO ICONIC].mp4',
  'tari::Miaw': 'src/TARI MODERN/miaw_intro + What is love_ .mp3',
  'tari::SERAPHIVE': 'src/TARI MODERN/SERAPHIVE_BLACK AND BOLD.mp3',
};
const EXTRA_TRACKS = {
  tari: [
    { label: 'TRIARCHY [FROM ZERO TO ICONIC]', path: 'src/TARI MODERN/TRIARCHY[FROM ZERO TO ICONIC].mp4' },
    { label: 'miaw intro + What is Love', path: 'src/TARI MODERN/miaw_intro + What is love_ .mp3' },
    { label: 'SERAPHIVE — BLACK AND BOLD', path: 'src/TARI MODERN/SERAPHIVE_BLACK AND BOLD.mp3' },
  ]
};

function getCategory(tab) {
  return tab === 'vokal' ? 'VOKAL SOLO' : 'TARI MODERN';
}

// ===== PARTICLE SYSTEM =====
const particleCanvas = document.getElementById('particleCanvas');
const pCtx = particleCanvas.getContext('2d');
let particles = [];

function resizeParticleCanvas() {
  particleCanvas.width = window.innerWidth;
  particleCanvas.height = window.innerHeight;
}
resizeParticleCanvas();
window.addEventListener('resize', resizeParticleCanvas);

class Particle {
  constructor() {
    this.reset();
    this.x = Math.random() * particleCanvas.width;
  }
  reset() {
    this.x = Math.random() * particleCanvas.width;
    this.y = -10;
    this.size = Math.random() * 2.5 + .5;
    this.speed = Math.random() * .4 + .15;
    this.opacity = Math.random() * .5 + .1;
    // Gold to purple hues
    this.hue = Math.random() > .5 ? Math.random() * 30 + 30 : Math.random() * 60 + 250;
  }
  update() {
    this.y += this.speed;
    this.x += Math.sin(this.y * .005) * .3;
    if (this.y > particleCanvas.height + 10) this.reset();
  }
  draw() {
    pCtx.beginPath();
    pCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    pCtx.fillStyle = `hsla(${this.hue}, 80%, 70%, ${this.opacity})`;
    pCtx.fill();
  }
}

for (let i = 0; i < 80; i++) {
  const p = new Particle();
  p.y = Math.random() * particleCanvas.height;
  particles.push(p);
}

function drawParticles() {
  pCtx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
  particles.forEach(p => { p.update(); p.draw(); });
}



// ===== SYNC AUDIO =====
function syncAudio(state) {
  // Pre-load audio file as soon as participant is selected
  if (state && state.audioFile && state.audioFile !== currentAudioFile) {
    currentAudioFile = state.audioFile;
    backdropAudio.src = state.audioFile;
    backdropAudio.load();
  }

  if (!state || !state.audioFile) {
    if (!backdropAudio.paused) backdropAudio.pause();
    return;
  }

  // Sync position when playing
  if (state.audioPlaying) {
    const timeDiff = Math.abs(backdropAudio.currentTime - state.audioTime);
    if (timeDiff > 1.5 && backdropAudio.readyState > 0) {
      backdropAudio.currentTime = state.audioTime;
    }
  }

  // Sync play/pause
  if (state.audioPlaying && backdropAudio.paused) {
    backdropAudio.play().catch(() => {});
  } else if (!state.audioPlaying && !backdropAudio.paused) {
    backdropAudio.pause();
  }
}

// ===== UPDATE DISPLAY =====
let isTransitioning = false;

function updateDisplay(state) {
  lastState = state;

  if (!state || !state.name) {
    categoryDisplay.textContent = '—';
    displayArea.innerHTML = `
      <div class="idle-icon">🎭</div>
      <div class="idle">Menunggu operator...</div>
    `;
    connectionStatus.innerHTML = '<span class="disconnected">⏳ Menunggu koneksi...</span>';
    return;
  }

  const cat = getCategory(state.tab);
  categoryDisplay.textContent = cat;
  connectionStatus.innerHTML = '<span class="connected">● Terhubung</span>';

  // Trigger transition effect on name change
  const oldName = displayArea.querySelector('.name');
  if (oldName && oldName.textContent !== state.name) {
    transitionOverlay.classList.add('active');
    setTimeout(() => transitionOverlay.classList.remove('active'), 400);

    mainContainer.style.animation = 'none';
    void mainContainer.offsetHeight;
    mainContainer.style.animation = 'fadeIn .5s ease-out';
  }

  displayArea.innerHTML = `
    <div class="name-wrapper">
      <div class="name">${state.name}</div>
    </div>
    <div class="event-name">Informatics Dies Natalis Expo</div>
    <div class="tagline">Merayakan Kreativitas, Memperkuat Solidaritas</div>
    <div class="number">Peserta ke-${state.index + 1} dari ${state.total}</div>
    <div class="divider"></div>
  `;

  syncAudio(state);
}

// ===== ANIMATION LOOP =====
function animate() {
  drawParticles();
  requestAnimationFrame(animate);
}
animate();

// ===== KEYBOARD SHORTCUTS =====
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') {
    backdropAudio.currentTime = Math.max(0, backdropAudio.currentTime - 5);
  } else if (e.key === 'ArrowRight') {
    backdropAudio.currentTime = Math.min(backdropAudio.duration || 0, backdropAudio.currentTime + 5);
  }
});

// ===== SOCKET.IO =====
let socket = null;
try {
  socket = io();
  socket.on('connect', () => {
    socket.emit('request-state');
  });
  socket.on('state', (data) => {
    updateDisplay(data);
  });
  socket.on('disconnect', () => {
    connectionStatus.innerHTML = '<span class="disconnected">⏸ Terputus</span>';
  });
} catch(e) {
  connectionStatus.textContent = 'Socket not available';
}

// ===== FALLBACK: LOCALSTORAGE =====
window.addEventListener('storage', (e) => {
  if (e.key === 'seni-state') {
    try {
      const state = JSON.parse(e.newValue);
      if (!lastState || state.timestamp !== lastState.timestamp) {
        updateDisplay(state);
      }
    } catch {}
  }
});

try {
  const saved = localStorage.getItem('seni-state');
  if (saved) {
    const state = JSON.parse(saved);
    updateDisplay(state);
  }
} catch {}

// Preload all audio files in background
function preloadAllAudio() {
  const paths = new Set();
  Object.values(FILE_MAP).forEach(p => paths.add(p));
  EXTRA_TRACKS.tari.forEach(t => paths.add(t.path));
  let i = 0;
  const arr = [...paths];
  function loadNext() {
    if (i >= arr.length) return;
    fetch(arr[i++], { cache: 'force-cache' }).then(loadNext).catch(loadNext);
  }
  setTimeout(loadNext, 1000);
}
preloadAllAudio();
</script>
</body>
</html>
